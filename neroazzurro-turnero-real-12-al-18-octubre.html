function show(v){version=v;document.querySelectorAll('.tabs button').forEach((b,i)=>b.classList.toggle('active',i===v));document.getElementById('desc').textContent=desc[v];currentSvg=build(v);document.getElementById('preview').innerHTML=currentSvg}
