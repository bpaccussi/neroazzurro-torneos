<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nero Azzurro · Circuito Rankeado</title><style>:root{font-family:Arial,Helvetica,sans-serif;color:#f4f7ff;background:#080b12}*{box-sizing:border-box}body{margin:0}header{background:#111827;text-align:center;padding:30px 12px;border-bottom:2px solid #198cff}header h1{margin:0;letter-spacing:2px;font-size:30px}header h1 span{color:#238fff}header small{letter-spacing:3px;color:#b3c1d5}main{max-width:1120px;margin:28px auto;padding:0 16px}.muted{color:#aebbd0}.pill{display:inline-block;border:1px solid #247bd1;color:#8ac0ff;border-radius:30px;padding:7px 12px;font-size:12px}.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:22px 0}input,select{width:100%;background:#151f30;color:white;border:1px solid #34465f;border-radius:8px;padding:13px;font-size:15px}input::placeholder{color:#aab7c9}.card{background:#151e2e;border:1px solid #2a3e5a;border-radius:12px;padding:16px;margin:10px 0}.meta{font-size:12px;color:#78b8ff;font-weight:700;letter-spacing:.4px}.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;margin-top:12px}.vs{color:#94a6bf;font-size:12px}.empty{padding:28px;text-align:center;color:#b3c1d5}.section{margin-top:30px}.section h2{font-size:21px}#status{margin:16px 0}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}button{background:#207de3;color:white;border:0;border-radius:8px;padding:10px 14px;cursor:pointer}@media(max-width:680px){.filters{grid-template-columns:1fr}.teams{gap:7px;font-size:14px}header h1{font-size:25px}}</style></head><body><header><h1>NERO <span>AZZURRO</span></h1><small>PÁDEL INDOOR · TORNEOS</small></header><main><span class="pill">18.ª FECHA · CIRCUITO RANKEADO 2026</span><h1>Partidos del torneo</h1><p class="muted">Todos los partidos en el orden de la planilla. Filtrá por día, categoría o jugador.</p><div class="filters"><select id="day"><option value="">Todos los días</option><option>Viernes</option><option>Sábado</option><option>Domingo</option></select><select id="category"><option value="">Todas las categorías</option><option value="7MA DAMAS">7ma Damas</option><option value="5TA CABALLEROS">5ta Caballeros</option></select><input id="player" type="search" placeholder="Buscar jugador o jugadora" aria-label="Buscar jugador"></div><div class="top"><span id="count" class="muted"></span><button id="refresh">Actualizar partidos</button></div><div id="status" role="status" class="muted">Cargando partidos…</div><div id="matches"></div><p class="muted" style="margin:40px 0;text-align:center;font-size:12px">NERO AZZURRO PÁDEL INDOOR · CIRCUITO RANKEADO 2026</p></main><script>
const API='https://script.google.com/macros/s/AKfycbx9tLj1eKnwfla7QAdGyygC8Bf7DLZuS-3y08EsYdOtLEvw8hG1rjuUrGPvEV071aXL/exec';let all=[];const el=id=>document.getElementById(id);const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();function node(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}function render(){const day=el('day').value,cat=el('category').value,q=norm(el('player').value.trim());const filtered=all.filter(p=>(!day||p.dia===day)&&(!cat||norm(p.categoria)===norm(cat))&&(!q||norm((p.pareja1||'')+' '+(p.pareja2||'')).includes(q)));el('count').textContent=`${filtered.length} de ${all.length} partidos`;const root=el('matches');root.replaceChildren();if(!filtered.length){root.append(node('div','empty','No hay partidos para esos filtros.'));return}let current='';for(const p of filtered){if(p.dia!==current){current=p.dia;const section=node('div','section');section.append(node('h2','',current));root.append(section)}const card=node('article','card');card.append(node('div','meta',`${p.hora||'Horario a confirmar'} · ${p.categoria||''} · ${p.instancia||''} · Zona ${p.zona||'-'} · ${p.partido||''}`));const teams=node('div','teams');teams.append(node('div','',p.pareja1||'Por definir'));teams.append(node('span','vs','VS'));teams.append(node('div','',p.pareja2||'Por definir'));card.append(teams);root.append(card)}}async function load(){el('status').textContent='Actualizando partidos…';try{const response=await fetch(API+'?t='+Date.now(),{redirect:'follow',cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();if(!Array.isArray(data.partidos))throw Error('Formato inesperado');all=data.partidos;el('status').textContent='';render()}catch(e){el('status').textContent='No se pudieron cargar los partidos. Verificá la conexión y volvé a intentar.';console.error(e)}}['day','category','player'].forEach(id=>el(id).addEventListener(id==='player'?'input':'change',render));el('refresh').addEventListener('click',load);load();
</script></body></html>
