<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NeroAzzurro | 18º Fecha Circuito Rankeado</title><style>
:root{--bg:#050a12;--panel:#0d1829;--line:#29425e;--blue:#1689ff;--text:#f8fbff;--muted:#aebed1}
*{box-sizing:border-box}[hidden]{display:none!important}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}button,input,select{font:inherit}button{cursor:pointer}
.hero{min-height:82vh;position:relative;overflow:hidden;background:radial-gradient(ellipse at 84% 35%,#103b70 0%,transparent 42%),linear-gradient(112deg,#04080f 20%,#08172b 68%,#05101e 100%)}
.hero:before{content:'';position:absolute;inset:0;opacity:.22;background:repeating-linear-gradient(90deg,transparent 0 125px,#4176a1 126px,#4176a1 128px,transparent 129px 250px),linear-gradient(170deg,transparent 64%,#0871d9 65%,#0871d9 65.3%,transparent 65.6%);pointer-events:none}
.hero-inner{position:relative;max-width:1200px;margin:auto;padding:42px 24px 60px}.brand{display:flex;align-items:center;gap:13px;font-size:23px;font-weight:800;letter-spacing:-.7px}.brand-mark{width:64px;height:64px;border:2px solid #e5f1ff;border-radius:50%;display:grid;place-items:center;background:#061b55;font-size:24px;letter-spacing:-3px;flex-shrink:0}.brand span,.blue{color:var(--blue)}.brand small{display:block;font-size:11px;font-weight:400;letter-spacing:2px;color:#d7e2f0;margin-top:4px}.hero-copy{margin-top:76px;max-width:930px}.eyebrow{color:#58a9ff;letter-spacing:5px;font-size:16px}.circuit{letter-spacing:4px;font-size:14px;margin-top:8px}.hero h1{font-size:clamp(42px,7vw,90px);line-height:.98;letter-spacing:-3px;margin:24px 0 28px}.details{display:flex;flex-wrap:wrap;gap:22px 35px;align-items:center;font-size:19px;font-weight:700}.details small{display:block;color:var(--muted);font-size:12px;letter-spacing:2px;margin-top:7px;font-weight:400}.categories{display:flex;flex-wrap:wrap;gap:12px;margin:28px 0}.category{border:1px solid #42607c;background:#09172a9c;border-radius:9px;padding:15px 24px;font-weight:700;min-width:200px}.category strong{color:#45a5ff}.home-nav{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:35px}.home-nav button{background:#0b1729d9;border:1px solid #4a6582;color:white;border-radius:10px;padding:20px 12px;font-size:15px;font-weight:700}.home-nav button:first-child,.home-nav button:hover{background:#117df2;border-color:#117df2}.sponsors{border-top:1px solid #2a3a4d;background:#050a12;padding:28px 22px 40px}.sponsors h2{text-align:center;font-size:12px;font-weight:500;letter-spacing:4px;color:#90a5bb;margin:0 0 24px}.sponsor-grid{max-width:1250px;margin:auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));align-items:center}.sponsor{min-width:0;min-height:94px;display:flex;align-items:center;justify-content:center;padding:12px 17px;border-right:1px solid #2c4059}.sponsor:last-child{border:0}.sponsor img{width:100%;max-height:82px;object-fit:contain;display:block}
.content-wrap{max-width:1200px;margin:auto;padding:34px 18px 60px}.back{border:1px solid #3e5c7e;background:transparent;color:#c6dcf3;padding:11px 16px;border-radius:8px}.section-head h2{font-size:32px;margin:25px 0 9px}.muted,.section-head p{color:var(--muted)}.filters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin:22px 0}select,input{width:100%;padding:15px;background:var(--panel);color:white;border:1px solid var(--line);border-radius:9px;font-size:15px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:18px 0}.refresh{border:1px solid #187ee7;background:#187ee7;color:white;border-radius:9px;padding:12px 17px}.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:18px;margin:10px 0}.meta{font-size:13px;color:#78baff;font-weight:bold;margin-bottom:12px}.versus{display:grid;grid-template-columns:1fr auto 1fr;gap:15px;align-items:center}.vs{color:var(--muted);font-size:13px}.zone{margin:22px 0 30px}.zone h3,.day-title{font-size:22px;margin:26px 0 16px}.pair{padding:11px 0;border-bottom:1px solid var(--line)}.pair:last-child{border-bottom:0}.pair strong{color:var(--blue);margin-right:12px}.match{padding:10px 0;border-bottom:1px solid var(--line);color:var(--muted);font-size:14px}.match:last-child{border:0}.empty{padding:30px;text-align:center;color:var(--muted)}footer{text-align:center;color:#8092aa;font-size:12px;padding:24px 15px;border-top:1px solid #21354b}

@media(max-width:650px){.hero-inner{padding:25px 18px 38px}.brand{font-size:20px}.brand-mark{width:54px;height:54px}.hero-copy{margin-top:58px}.eyebrow{font-size:13px;letter-spacing:3px}.circuit{font-size:12px;letter-spacing:2px}.hero h1{letter-spacing:-1px;font-size:clamp(36px,10vw,58px)}.details{font-size:17px}.categories{display:grid;grid-template-columns:1fr 1fr}.category{min-width:0;padding:12px}.home-nav{grid-template-columns:1fr}.home-nav button{padding:17px}.sponsor-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.sponsor:nth-child(3){border-right:1px solid #2c4059}.sponsor:nth-child(2n){border-right:0}.sponsor:nth-child(n+3){border-top:1px solid #2c4059}.filters{grid-template-columns:1fr}.versus{grid-template-columns:1fr;gap:8px}.vs{text-align:center}.toolbar{align-items:flex-start;flex-direction:column}}

/* Mejoras de visualización de partidos y zonas */
.meta-line{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;white-space:nowrap;font-size:clamp(9px,1.5vw,12px);overflow-x:auto;scrollbar-width:thin;padding-bottom:4px}
.meta-line .meta-main{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.status{flex:none;border:1px solid #4c6684;border-radius:6px;padding:4px 7px;color:#dce9fa;font-size:11px;font-weight:700;white-space:nowrap}
.status[data-status="en juego"]{color:#90d7ff;border-color:#1689ff;background:#0b3962}
.status[data-status="jugado"]{color:#a6f0cf;border-color:#3b9978;background:#12392f}
.status[data-status="suspendido"]{color:#ffb4b4;border-color:#a64d56;background:#3b1821}
.pair-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:clamp(10px,1.9vw,14px)}
.pair-row:last-child{border:0}.pair-num{color:#53a8ff;font-weight:800;flex:none;min-width:16px}
.pair-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qualified{flex:none;color:#a6f0cf;font-size:11px;font-weight:700;white-space:nowrap}
.zone-match{padding:13px 0;border-bottom:1px solid var(--line)}.zone-match:last-child{border:0}
.zone-match-head{display:flex;align-items:center;gap:8px;white-space:nowrap;font-size:clamp(10px,1.7vw,12px);color:#a9c9e9}
.zone-match-head .zone-match-info{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis}
.sets{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.set-box{display:flex;align-items:center;justify-content:center;min-width:51px;padding:6px 8px;border:1px solid #436080;border-radius:7px;background:#071324;font-size:13px;font-weight:700;color:#fff}
.set-label{color:#8fa8c2;font-size:10px;margin-right:7px}.zone-players{font-size:12px;color:#e7f1ff;margin-top:7px;overflow-wrap:anywhere}
@media(max-width:650px){.meta-line{font-size:10px;gap:5px}.status{font-size:9px;padding:3px 5px}.card{padding:12px}.pair-row{font-size:11px}.qualified{font-size:10px}.zone-match-head{font-size:10px}}
.brand-original{display:flex;align-items:center}.original-logo{display:block;width:155px;height:auto;max-width:42vw;object-fit:contain;background:white;border-radius:6px;padding:5px}@media(max-width:650px){.original-logo{width:130px}}

/* Ajustes solicitados: parejas enfrentadas, formato uniforme y resultados */
.versus{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:18px}
.versus .team-first{text-align:right;overflow-wrap:anywhere}
.versus .team-second{text-align:left;overflow-wrap:anywhere}
.vs{text-transform:lowercase;font-weight:700}
.zone-match-body{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.zone-match-body .sets{margin-top:8px}
.set-box.empty-set{border-style:dashed;opacity:.45;min-width:49px;height:29px}
@media(max-width:650px){.versus{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;font-size:clamp(10px,2.9vw,14px)}.vs{font-size:11px}.zone-match-body{gap:5px}}

/* Llaves eliminatorias: trazado horizontal y desplazamiento táctil */
.bracket-scroll{overflow-x:auto;overflow-y:visible;padding:14px 3px 24px;scrollbar-color:#3973aa #0b1829}
.bracket{display:flex;align-items:stretch;gap:0;min-width:max-content;padding:8px 0 18px}
.bracket-round{width:238px;flex:0 0 238px;display:flex;flex-direction:column}
.bracket-round-title{font-size:13px;letter-spacing:1.7px;font-weight:800;color:#6fb8ff;text-align:center;margin:0 0 24px;min-height:19px}
.bracket-matches{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:16px;padding:4px 0}
.bracket-game{position:relative;min-height:103px;margin:8px 17px 8px 0;border:1px solid #375677;border-left:3px solid #1689ff;border-radius:9px;background:linear-gradient(135deg,#11233b,#0b1728);padding:10px 11px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 5px 14px #0003}
.bracket-game:after{content:'';position:absolute;left:100%;top:50%;width:17px;border-top:1px solid #44729b}
.bracket-round:last-child .bracket-game:after{display:none}
.bracket-round:not(:last-child) .bracket-game:before{content:'';position:absolute;left:calc(100% + 16px);top:50%;height:0;width:1px;background:#44729b}
.bracket-id{font-size:10px;font-weight:700;color:#5b9bd3;letter-spacing:.8px;margin-bottom:5px}
.bracket-team{font-size:12px;line-height:1.35;font-weight:700;overflow-wrap:anywhere;min-height:17px}
.bracket-team + .bracket-team{border-top:1px solid #29415d;margin-top:5px;padding-top:5px}
.bracket-time{font-size:10px;color:#9eb8d2;margin-top:7px}
.bracket-final .bracket-game{border-color:#4e96d9;border-left-color:#80c4ff;background:linear-gradient(140deg,#16395b,#0b1d34)}
.bracket-hint{font-size:12px;color:#8faac6;margin:0 0 8px}
@media(min-width:1000px){.home-nav{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:650px){.bracket-round{width:205px;flex-basis:205px}.bracket-game{margin-right:14px}.bracket-game:after{width:14px}.bracket-team{font-size:11px}}

/* Llaves: diagrama limpio, alineado y conectado */
.llave-scroll{overflow-x:auto;overflow-y:hidden;padding:12px 0 20px;scrollbar-color:#376b9b #081320}
.llave-canvas{position:relative;min-width:max-content}
.llave-lineas{position:absolute;inset:0;overflow:visible;pointer-events:none}

.llave-titulo{position:absolute;top:16px;text-align:center;font-size:12px;letter-spacing:2px;font-weight:800;color:#64b5ff}
.llave-partido{position:absolute;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;padding:9px 12px;border:1px solid #355776;border-radius:7px;background:#0c1c30;box-shadow:0 5px 12px #0003}
.llave-partido-final{border-color:#2993ed;background:#102d4c}
.llave-pareja{flex:1;display:flex;align-items:center;font-size:12px;line-height:1.2;font-weight:700;color:#f5f8ff;overflow-wrap:anywhere}
.llave-pareja+.llave-pareja{border-top:1px solid #28425e}
.llave-horario{font-size:10px;line-height:1.1;color:#9cb8d1;padding-top:5px;white-space:nowrap}
</style>
<style>
/* Llaves Nero Azzurro: tarjetas de tres sectores y líneas de avance */
.llave-scroll{overflow-x:auto;overflow-y:auto;padding:10px 0 22px;scrollbar-color:#328ed5 #081320}
.llave-canvas{position:relative;min-width:max-content}

.llave-titulo{position:absolute;top:12px;text-align:left;font-size:13px;letter-spacing:1.5px;font-weight:800;color:#76c5ff;border-bottom:2px solid #258ce4;padding-bottom:11px}
.llave-partido{position:absolute;box-sizing:border-box;border:1px solid #3281bc;border-radius:8px;background:#0a1c30;box-shadow:0 7px 20px #0005;overflow:visible;color:#fff}

.llave-cuerpo{height:100%;display:grid;grid-template-columns:56px minmax(0,1fr) 76px;grid-template-rows:1fr 1fr;overflow:hidden;border-radius:7px}

.llave-ref.segunda,.llave-nombre.segunda{border-top:1px solid #315879}
.llave-nombre{padding:5px 8px;font-size:11px;line-height:1.2;font-weight:700;overflow-wrap:anywhere}
.llave-nombre.sin-nombre{color:#6b91ae}
.llave-fecha{grid-column:3;grid-row:1/3;flex-direction:column;justify-content:center;gap:3px;text-align:center;background:#102b47;border-left:1px solid #315879;font-size:11px;font-weight:700}
.llave-fecha span{font-size:10px;font-weight:500;color:#a5c9e4}
.llave-estado{position:absolute;right:8px;top:-13px;z-index:2;padding:4px 11px;border:1px solid #6082a6;border-radius:16px;background:#244361;font-size:10px;font-weight:700;white-space:nowrap}
.llave-estado.jugado{background:#116744;border-color:#1caa74}
.llave-estado.en-juego{background:#0869b7;border-color:#40b4ff}
.llave-hint{color:#a6c2d8;font-size:12px;margin:0 0 8px}
</style>

<section id="seccion" hidden><main class="content-wrap"><button class="back" onclick="inicio()">← Volver al inicio</button><div class="section-head"><h2 id="titulo">Partidos del torneo</h2><p id="descripcion">Consultá los partidos, horarios y jugadores.</p></div><div id="filtros" class="filters"><select id="dia" onchange="mostrar()"><option value="">Todos los días</option></select><select id="categoria" onchange="mostrar()"><option value="">Todas las categorías</option></select><input id="buscar" placeholder="Buscar jugador o jugadora" oninput="mostrar()"></div><div class="toolbar"><span class="muted" id="contador">Cargando información...</span><button class="refresh" onclick="cargar()">Actualizar información</button></div><div id="contenido"></div></main></section><footer>NEROAZZURRO PÁDEL INDOOR · CIRCUITO RANKEADO 2026</footer><script>
const API='https://script.google.com/macros/s/AKfycbx9tLj1eKnwfla7QAdGyygC8Bf7DLZuS-3y08EsYdOtLEvw8hG1rjuUrGPvEV071aXL/exec';
let datos={partidos:[],zonasDamas:[],zonasCaballeros:[],llaves:[]};
let vista='partidos';
function sinTildes(valor){return String(valor??'').normalize('NFD').replace(/[\u0300-\u0301\u0302\u0303\u0304\u0306\u0308]/g,'');}
function nombre(valor){return limpio(sinTildes(valor));}
function categoriaVisible(valor){return String(valor??'').replace(/7\s*(?:MA|ma)/gi,'7ma').replace(/5\s*(?:TA|ta)/gi,'5ta').replace(/DAMAS/gi,'DAMAS').replace(/CABALLEROS/gi,'CABALLEROS');}
function horaVisible(valor){const h=String(valor??'').trim();return h?h.replace(/\s*hs\.?$/i,'')+' hs':'';}
function cruceVisible(valor){return String(valor??'').replace(/\bVS\b/gi,'vs');}
function limpio(valor){return String(valor??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function abrir(nueva){vista=nueva;document.getElementById('portada').hidden=true;document.getElementById('seccion').hidden=false;document.getElementById('filtros').style.display=vista==='partidos'?'grid':'none';const titulos={partidos:'Partidos del torneo',damas:'Zonas 7ma DAMAS',caballeros:'Zonas 5ta CABALLEROS',llaveDamas:'Llaves 7ma DAMAS',llaveCaballeros:'Llaves 5ta CABALLEROS'};document.getElementById('titulo').textContent=titulos[vista];document.getElementById('descripcion').textContent=vista==='partidos'?'Todos los partidos en el orden de la planilla. Filtrá por día, categoría o jugador.':(vista.startsWith('llave')?'Seguí el camino de las parejas hasta la final.':'Consultá las parejas de cada zona y sus cruces de clasificación.');mostrar();window.scrollTo(0,0)}
function inicio(){document.getElementById('portada').hidden=false;document.getElementById('seccion').hidden=true;window.scrollTo(0,0)}
const VISTA_PREVIA=location.protocol==='file:';
function datosDeMuestra(){
 // Estructura confirmada por la llave de 5ta Caballeros que envió la organización.
 // Sin nombres ni horarios inventados: solo la final confirmada a las 18:30.
 const c='5ta CABALLEROS';
 const r=(instancia,codigo,referencia1,referencia2,hora='')=>({categoria:c,instancia,codigo,referencia1,referencia2,dia:hora?'Domingo':'',hora,pareja1:'',pareja2:''});
 return [
 r('Cuartos','C-C1','2º B','2º C'),
 r('Cuartos','C-C2','1º C','2º A'),
 r('Cuartos','C-C3','3º A','1º B'),
 r('Semifinal','C-S1','1º A','Ganador C-C1'),
 r('Semifinal','C-S2','Ganador C-C2','Ganador C-C3'),
 r('Final','C-F1','Ganador C-S1','Ganador C-S2','18:30')
 ];
}
let cargaNumero=0;
let ultimaCargaExitosa=0;
const CLAVE_ULTIMA_CARGA='neroazzurro_ultimo_estado_v2';
function validarRespuesta(nuevos){
 if(!nuevos||typeof nuevos!=='object'||!Array.isArray(nuevos.partidos)||!Array.isArray(nuevos.zonasDamas)||!Array.isArray(nuevos.zonasCaballeros)||!Array.isArray(nuevos.llaves)){
  throw Error('La respuesta de Sheets está incompleta');
 }
 return {partidos:nuevos.partidos,zonasDamas:nuevos.zonasDamas,zonasCaballeros:nuevos.zonasCaballeros,llaves:nuevos.llaves};
}
function restaurarUltimaCarga(){
 if(location.protocol==='file:')return;
 try{
  const guardado=JSON.parse(sessionStorage.getItem(CLAVE_ULTIMA_CARGA)||'null');
  if(!guardado||Date.now()-guardado.fecha>10*60*1000)return;
  datos=validarRespuesta(guardado.datos);
  ultimaCargaExitosa=guardado.fecha;
  actualizarFiltros();mostrar();
  document.getElementById('contador').textContent='Mostrando última información recibida · verificando cambios...';
 }catch(e){console.warn('No se pudo recuperar la última carga',e)}
}
async function cargar(){
 const numero=++cargaNumero;
 const contador=document.getElementById('contador');
 const contenido=document.getElementById('contenido');
 const hayDatos=ultimaCargaExitosa>0;
 if(!hayDatos){
  contador.textContent='Conectando con Google Sheets...';
  contenido.innerHTML='<div class="empty">Cargando partidos, zonas y llaves desde Google Sheets. Puede tardar unos segundos...</div>';
 }else{
  contador.textContent='Actualizando desde Google Sheets... · se conserva la última información mientras carga';
 }
 const controlador=new AbortController();
 const limite=setTimeout(()=>controlador.abort(),30000);
 try{
  // El parámetro único evita que el navegador o un proxy reutilicen una respuesta anterior.
  const url=API+(API.includes('?')?'&':'?')+'_actualizado='+Date.now();
  const respuesta=await fetch(url,{cache:'no-store',signal:controlador.signal,redirect:'follow'});
  if(!respuesta.ok)throw Error('HTTP '+respuesta.status);
  const nuevos=await respuesta.json();
  if(nuevos.error)throw Error(String(nuevos.error));
  const recibidos=validarRespuesta(nuevos);
  if(numero!==cargaNumero)return;
  datos=recibidos; // Reemplazo completo: los resultados borrados no permanecen en pantalla.
  ultimaCargaExitosa=Date.now();
  window.PREVIA_REAL=true;
  if(location.protocol!=='file:'){
   try{sessionStorage.setItem(CLAVE_ULTIMA_CARGA,JSON.stringify({fecha:ultimaCargaExitosa,datos:recibidos}))}catch(e){console.warn('Sin almacenamiento temporal',e)}
  }
  actualizarFiltros();mostrar();
 }catch(error){
  if(numero!==cargaNumero)return;
  if(location.protocol==='file:' && !ultimaCargaExitosa){
   datos={partidos:[],zonasDamas:[],zonasCaballeros:[],llaves:datosDeMuestra()};
   window.PREVIA_REAL=false;
   actualizarFiltros();mostrar();
   contador.textContent='VISTA LOCAL · estructura de 5ta sin datos en vivo';
  }else if(ultimaCargaExitosa){
   contador.textContent='No se pudo actualizar · mostrando datos anteriores ('+new Date(ultimaCargaExitosa).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})+') · reintentá con Actualizar información';
  }else{
   contador.textContent='No se pudo conectar con Sheets';
   contenido.innerHTML='<div class="empty">No se pudo recibir información de Google Sheets. Usá «Actualizar información» para volver a intentar.</div>';
  }
  console.error('Error de actualización',error);
 }finally{clearTimeout(limite)}
}
function actualizarFiltros(){const dias=[...new Set(datos.partidos.map(p=>p.dia).filter(Boolean))];const categorias=[...new Set(datos.partidos.map(p=>p.categoria).filter(Boolean))];document.getElementById('dia').innerHTML='<option value="">Todos los días</option>'+dias.map(d=>`<option>${limpio(d)}</option>`).join('');document.getElementById('categoria').innerHTML='<option value="">Todas las categorías</option>'+categorias.map(c=>`<option value="${limpio(c)}">${limpio(categoriaVisible(c))}</option>`).join('')}
function mostrar(){if(vista==='partidos')mostrarPartidos();else if(vista==='llaveDamas'||vista==='llaveCaballeros')mostrarLlave();else mostrarZonas(vista==='damas'?datos.zonasDamas:datos.zonasCaballeros)}
function estadoEtiqueta(valor){const estado=String(valor||'En Espera').trim();return `<span class="status" data-status="${limpio(estado.toLowerCase())}">${limpio(estado)}</span>`}
function resultadosEnCasillas(texto){const sets=String(texto||'').trim().match(/\d+\s*[-–]\s*\d+/g)||[];return sets.length?`<div class="sets">${sets.map((set,i)=>`<span class="set-box"><span class="set-label">${i===2?'STB':'SET '+(i+1)}</span>${limpio(set.replace(/\s/g,''))}</span>`).join('')}</div>`:'<div class="sets" aria-label="Resultado pendiente"><span class="set-box empty-set"></span><span class="set-box empty-set"></span></div>'}
function estadoCruce(z,c){
  const norm=v=>String(v||'').trim().toLocaleUpperCase().replace(/\s+/g,' ');
  // Coinciden categoría, zona, día, hora y enfrentamiento: evita confundir el orden diario.
  const iguales=datos.partidos.filter(p=>norm(p.categoria)===norm(z.categoria)&&norm(p.zona)===norm(z.zona)&&norm(p.dia)===norm(c.dia)&&norm(p.hora)===norm(c.hora)&&norm(p.partido)===norm(c.cruce));
  return iguales.length===1?iguales[0].estado:(c.estado||'En Espera');
}
function mostrarPartidos(){
 const dia=document.getElementById('dia').value,categoria=document.getElementById('categoria').value,busqueda=document.getElementById('buscar').value.toLocaleLowerCase();
 const lista=datos.partidos.filter(p=>(!dia||p.dia===dia)&&(!categoria||p.categoria===categoria)&&(!busqueda||[p.pareja1,p.pareja2].join(' ').toLocaleLowerCase().includes(busqueda)));
 document.getElementById('contador').textContent=`${lista.length} de ${datos.partidos.length} partidos`;
 if(!lista.length){document.getElementById('contenido').innerHTML='<div class="empty">No hay partidos para mostrar.</div>';return}
 let html='',ultimoDia='';
 lista.forEach(p=>{
  if(p.dia!==ultimoDia){ultimoDia=p.dia;html+=`<h3 class="day-title">${limpio(p.dia)}</h3>`}
  const info=`Nº ${limpio(p.orden)} · ${limpio(horaVisible(p.hora))} · ${limpio(categoriaVisible(p.categoria))} · ${limpio(p.instancia)}${p.zona?' · Zona '+limpio(p.zona):''}${p.partido?' · '+limpio(cruceVisible(p.partido)):''}`;
  html+=`<article class="card"><div class="meta meta-line"><span class="meta-main" title="${limpio(info)}">${info}</span>${estadoEtiqueta(p.estado)}</div><div class="versus"><div class="team-first">${nombre(p.pareja1)}</div><div class="vs">vs</div><div class="team-second">${nombre(p.pareja2)}</div></div></article>`
 });document.getElementById('contenido').innerHTML=html;
}
function mostrarZonas(zonas){
 document.getElementById('contador').textContent=`${zonas.length} zonas`;
 if(!zonas.length){document.getElementById('contenido').innerHTML='<div class="empty">Todavía no hay zonas disponibles.</div>';return}
 let html='';
 zonas.forEach(z=>{
  html+=`<section class="zone"><h3>Zona ${limpio(z.zona)}</h3><div class="card">`;
  (z.parejas||[]).forEach(p=>{
   const posicion=Number(p.posicion);
   html+=`<div class="pair-row"><span class="pair-num">${limpio(p.numero)}</span><span class="pair-name" title="${limpio(p.pareja)}">${nombre(p.pareja)}</span>${posicion===1||posicion===2?`<span class="qualified">${posicion}º CLASIFICADO</span>`:''}</div>`;
  });html+='</div>';
  if(z.cruces&&z.cruces.length){
   html+='<div class="card"><div class="meta">PARTIDOS DE LA ZONA</div>';
   z.cruces.forEach(c=>{
    const info=`Nº ${limpio(c.numeroPartido||'—')} · ${limpio(cruceVisible(c.cruce))} · ${limpio(c.dia)} ${limpio(horaVisible(c.hora))}`;
    html+=`<div class="zone-match"><div class="zone-match-head"><span class="zone-match-info" title="${limpio(info)}">${info}</span>${estadoEtiqueta(estadoCruce(z,c))}</div>${resultadosEnCasillas(c.resultado)}</div>`;
   });html+='</div>';
  }html+='</section>';
 });document.getElementById('contenido').innerHTML=html;
}

// Se alimenta del arreglo «llaves» del mismo servicio de Google Sheets.
function mostrarLlave(){
 const damas=vista==='llaveDamas', prefijo=damas?'D-':'C-';
 const registros=(Array.isArray(datos.llaves)?datos.llaves:[]).filter(r=>String(r.codigo||'').toUpperCase().startsWith(prefijo));
 document.getElementById('contador').textContent=registros.length?`${registros.length} cruces`:'Sin cruces cargados';
 if(!registros.length){document.getElementById('contenido').innerHTML='<div class="empty">Todavía no hay cruces publicados.</div>';return;}
 const fases=[['O','OCTAVOS DE FINAL'],['C','CUARTOS DE FINAL'],['S','SEMIFINALES'],['F','FINAL']];
 const rondas=fases.map(([clave,titulo])=>({titulo,partidos:registros.filter(r=>String(r.codigo).toUpperCase().startsWith(prefijo+clave)).sort((a,b)=>parseInt(String(a.codigo).match(/\d+$/)?.[0]||0)-parseInt(String(b.codigo).match(/\d+$/)?.[0]||0))})).filter(r=>r.partidos.length);

 const H=70, P=87, top=82, W=338, gap=57, x0=10;
 const pos=new Map(), indice=new Map(), porCodigo=new Map(), directos=[];
 rondas.forEach((r,i)=>r.partidos.forEach(p=>{const k=String(p.codigo).toUpperCase();indice.set(k,i);porCodigo.set(k,p)}));
 function origen(ref){const m=String(ref||'').match(/([DC]-[OCSF]\d+)/i);return m?m[1].toUpperCase():null;}
 // Ubicamos las parejas por la estructura REAL de los cruces, no por la cantidad de partidos.
 // Las plazas que pasan directo ocupan su lugar en el árbol aunque no haya partido de cuartos.
 let siguiente=0;
 const yDe=new Map();
 function ubicar(codigo){
  if(yDe.has(codigo))return yDe.get(codigo);
  const p=porCodigo.get(codigo);
  if(!p)return top+(siguiente++)*P;
  const refs=[p.referencia1,p.referencia2];
  const hijos=refs.map((ref,lado)=>{
   const k=origen(ref);
   if(k&&porCodigo.has(k))return ubicar(k);
   const y=top+(siguiente++)*P;
   if(!k && iEsDirecto(p,ref))directos.push({padre:codigo,ref,y,lado});
   return y;
  });
  const y=(hijos[0]+hijos[1])/2;
  yDe.set(codigo,y);pos.set(codigo,y);
  return y;
 }
 function iEsDirecto(p,ref){return /^\s*\d+\s*[º°ªo]?\s*[A-Z]\s*$/i.test(String(ref||'')) && indice.get(String(p.codigo).toUpperCase())>0;}
 const ultima=rondas[rondas.length-1].partidos;
 ultima.forEach(p=>ubicar(String(p.codigo).toUpperCase()));
 // Para una llave con varios cruces finales incompletos, incorporamos los que falten.
 rondas.forEach(r=>r.partidos.forEach(p=>{const k=String(p.codigo).toUpperCase();if(!pos.has(k))ubicar(k)}));
 // Compactación proporcional de todas las ramas sin alterar conexiones.
 const base=top;
 const escala=.78;
 for(const [k,v] of pos)pos.set(k,base+(v-base)*escala);
 directos.forEach(d=>d.y=base+(d.y-base)*escala);
 const maxY=Math.max(...pos.values(),...directos.map(d=>d.y))+H+30;
 const width=x0+rondas.length*(W+gap)-gap+20;
 let svg=`<svg class="llave-lineas" width="${width}" height="${maxY}" viewBox="0 0 ${width} ${maxY}" aria-hidden="true">`;
 rondas.forEach((ronda,i)=>{if(!i)return;ronda.partidos.forEach(r=>{
  const y2=pos.get(String(r.codigo).toUpperCase())+H/2,x2=x0+i*(W+gap),mid=x2-gap/2;
  [r.referencia1,r.referencia2].forEach(ref=>{
   const k=origen(ref);
   if(!k||!pos.has(k)||indice.get(k)!==i-1)return;
   const y1=pos.get(k)+H/2,x1=x0+(i-1)*(W+gap)+W;
   svg+=`<path d="M ${x1} ${y1} H ${mid} V ${y2} H ${x2}"/>`;
  });
 });});
 // Un pase directo también entra desde la ronda anterior y se conecta como una segunda rama.
 directos.forEach(d=>{
  const i=indice.get(d.padre);if(i<1)return;
  const x2=x0+i*(W+gap),mid=x2-gap/2,y2=pos.get(d.padre)+H/2,y1=d.y+H/2;
  const x1=x0+(i-1)*(W+gap)+W;
  svg+=`<path d="M ${x1} ${y1} H ${mid} V ${y2} H ${x2}"/>`;
 });
 svg+='</svg>';
 function referenciaVisible(ref){
  const v=String(ref||'').trim();
  if(/^\d+\s*[º°ªo]?\s*[A-Z]$/i.test(v))return limpio(v.replace(/\s+/g,' '));
  return '';
 }
 function parejaVisible(v){
  const n=String(v||'').trim();
  if(!n||/^(ganador|ganadora|perdedor|perdedora|pendiente|por definir|nn\b)/i.test(n)||/^\d+\s*[º°ªo]?\s*[A-Z]$/i.test(n))return '';
  return nombre(n);
 }
 function estadoPartido(r){
  const norm=v=>sinTildes(String(v||'')).toUpperCase().replace(/\s+/g,' ').trim();
  const a=parejaVisible(r.pareja1),b=parejaVisible(r.pareja2);
  if(!a||!b)return 'En espera';
  const categoria=damas?'DAMAS':'CABALLEROS';
  const posibles=datos.partidos.filter(p=>norm(p.categoria).includes(categoria)&&norm(p.dia)===norm(r.dia)&&norm(p.hora)===norm(r.hora)&&((norm(p.pareja1)===norm(a)&&norm(p.pareja2)===norm(b))||(norm(p.pareja1)===norm(b)&&norm(p.pareja2)===norm(a))));
  return posibles.length===1?(posibles[0].estado||'En espera'):'En espera';
 }

(function(){

panel.innerHTML='<strong>LLAVES PARA GOOGLE SHEETS</strong><button id="exp-damas">Descargar 7ma Damas (PNG)</button><button id="exp-cab">Descargar 5ta Caballeros (PNG)</button><span id="export-note">Esperá que carguen los datos reales de Sheets.</span>';
document.body.prepend(panel);
async function exportar(tipo,boton){
 const nota=document.getElementById('export-note');
 if(!window.html2canvas){nota.textContent='No cargó el generador de imagen. Revisá la conexión a internet.';return}
 boton.disabled=true;nota.textContent='Preparando imagen completa...';
 try{
  abrir(tipo);
  if(!datos||!Array.isArray(datos.llaves)||!datos.llaves.length)throw new Error('Todavía no se cargaron los cruces de Google Sheets. Esperá unos segundos y volvé a intentar.');
  mostrarLlave();
  await new Promise(resolve=>setTimeout(resolve,350));
  const original=document.querySelector('.llave-escenario');
  if(!original)throw new Error('No se encontró la llave.');
  const clon=original.cloneNode(true);
  clon.style.width='max-content';clon.style.maxWidth='none';clon.style.overflow='visible';clon.style.margin='0';
  const desplazamiento=clon.querySelector('.llave-scroll');
  if(desplazamiento){desplazamiento.style.width='max-content';desplazamiento.style.maxWidth='none';desplazamiento.style.overflow='visible';desplazamiento.style.height='auto';desplazamiento.style.maxHeight='none'}
  const cont=document.createElement('div');cont.style.cssText='position:fixed;left:-20000px;top:0;z-index:-1;width:max-content;max-width:none;';cont.appendChild(clon);document.body.appendChild(cont);
  try{
   const w=Math.ceil(clon.scrollWidth),h=Math.ceil(clon.scrollHeight);
   if(w>6000||h>6000)throw new Error('La imagen es demasiado grande.');
   const canvas=await html2canvas(clon,{backgroundColor:'#04101d',scale:2,width:w,height:h,windowWidth:Math.max(1600,w),windowHeight:Math.max(900,h),useCORS:true,logging:false});
   const a=document.createElement('a');a.download=tipo==='llaveDamas'?'NeroAzzurro_Llave_7ma_Damas.png':'NeroAzzurro_Llave_5ta_Caballeros.png';a.href=canvas.toDataURL('image/png');document.body.appendChild(a);a.click();a.remove();
   nota.textContent='Imagen descargada. Pegala en tu Google Sheets.';
  }finally{cont.remove()}
 }catch(e){nota.textContent='Error: '+e.message}finally{boton.disabled=false}
}
document.getElementById('exp-damas').onclick=function(){exportar('llaveDamas',this)};
document.getElementById('exp-cab').onclick=function(){exportar('llaveCaballeros',this)};
// Start directly in the bracket view, and let the existing loading process fetch Sheets.
setTimeout(()=>abrir('llaveDamas'),100);
})();
</script>
</body></html>
